apiVersion: v1
kind: ConfigMap
metadata:
  name: xebuonho-config
  namespace: xebuonho
data:
  AWS_LOCATION_REGION: "ap-southeast-2"
  AWS_LOCATION_MAP_NAME: "explore.map"
  AWS_LOCATION_PLACE_INDEX: "explore.place"
  AWS_LOCATION_ROUTE_CALCULATOR: "explore.route"
  KAFKA_BROKERS: "kafka.xebuonho.svc.cluster.local:9092"
  REDIS_URL: "redis.xebuonho.svc.cluster.local:6379"
  DATABASE_URL: "postgresql://app:secret@postgres.xebuonho.svc.cluster.local:5432/xebuonho?sslmode=disable"
  LOG_LEVEL: "info"
