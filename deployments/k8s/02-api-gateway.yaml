apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: xebuonho
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: xebuonho/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: xebuonho-config
            - secretRef:
                name: xebuonho-secrets
          env:
            - name: HTTP_PORT
              value: "8000"
            - name: USER_SERVICE_URL
              value: "http://user-service:8091"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8087"
            - name: RIDE_SERVICE
              value: "ride-service:50051"
            - name: ORDER_SERVICE
              value: "order-service:50058"
            - name: MERCHANT_SERVICE
              value: "merchant-service:50059"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: xebuonho
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: xebuonho
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

