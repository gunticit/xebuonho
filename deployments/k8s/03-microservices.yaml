apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: xebuonho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: xebuonho/user-service:latest
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: xebuonho-config
            - secretRef:
                name: xebuonho-secrets
          env:
            - name: HTTP_PORT
              value: "8091"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: xebuonho
spec:
  ports:
    - port: 8091
      targetPort: 8091
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: xebuonho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: xebuonho/payment-service:latest
          ports:
            - containerPort: 8087
            - containerPort: 50054
          envFrom:
            - configMapRef:
                name: xebuonho-config
            - secretRef:
                name: xebuonho-secrets
          env:
            - name: HTTP_PORT
              value: "8087"
            - name: GRPC_PORT
              value: "50054"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: xebuonho
spec:
  ports:
    - port: 8087
      name: http
    - port: 50054
      name: grpc
  selector:
    app: payment-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-service
  namespace: xebuonho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ride-service
  template:
    metadata:
      labels:
        app: ride-service
    spec:
      containers:
        - name: ride-service
          image: xebuonho/ride-service:latest
          ports:
            - containerPort: 8080
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: xebuonho-config
            - secretRef:
                name: xebuonho-secrets
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "50051"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ride-service
  namespace: xebuonho
spec:
  ports:
    - port: 8080
      name: http
    - port: 50051
      name: grpc
  selector:
    app: ride-service

